    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://layoffpulse.pages.dev/#website",
          "url": "https://layoffpulse.pages.dev/",
          "name": "LayoffPulse",
          "alternateName": ["The Layoff Ledger", "Global Layoff Tracker"],
          "description": "Public interest archive of corporate and tech layoffs with primary SEC and WARN Act sources.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://layoffpulse.pages.dev/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Dataset",
          "@id": "https://layoffpulse.pages.dev/#dataset",
          "name": "Global Corporate and Tech Layoffs Dataset (2000–2026)",
          "description": "Comprehensive longitudinal database of corporate workforce terminations, categorized by four historic eras: Dot-Com Crash (2000-2002), Great Financial Crisis (2007-2009), COVID-19 Pandemic (2020-2021), and the AI & Efficiency Wave (2023-2026).",
          "url": "https://layoffpulse.pages.dev/",
          "license": "https://creativecommons.org/licenses/by-nc/4.0/",
          "temporalCoverage": "2000-01-01/2026-12-31",
          "spatialCoverage": "Global",
          "variableMeasured": [
            "Headcount Cut",
            "Percentage of Workforce Terminated",
            "Executive Narrative Stated",
            "SEC Form 8-K Filings",
            "State Department of Labor WARN Act Records",
            "Corporate Stock Buybacks in Termination Quarter"
          ],
          "creator": {
            "@type": "Organization",
            "name": "LayoffPulse Public Transparency Project"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://layoffpulse.pages.dev/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How many total tech and corporate workers have been laid off since 2000?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Over 2,480,000 cumulative layoffs have been documented across major global corporations and technology firms from 2000 to 2026, encompassing the Dot-Com crash (500,000+), the 2008 Financial Crisis (8.7M US BLS tracked), the COVID-19 mobility freeze (22.4M peak temporary/permanent displacements), and the ongoing AI Efficiency wave (540,000+)."
              }
            },
            {
              "@type": "Question",
              "name": "Why are profitable companies conducting mass layoffs during the AI era?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Unlike previous recessions caused by revenue collapse, the 2023-2026 wave is characterized by profitable tech giants reallocating operating capital from payroll into Nvidia AI chips, datacenters, and stock buybacks ($194B+ repurchased by Big Tech) to satisfy Wall Street demands for 40%+ operating margins."
              }
            },
            {
              "@type": "Question",
              "name": "What are the primary sources used to verify each layoff event?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every entry is backed by official government registries: US SEC Form 8-K filings on EDGAR, State Department of Labor WARN Act notices (California, Washington, Texas, Oregon, Florida), UK Insolvency Service HR1 notifications, German BetrVG works council registries, and Indian NCLT / BSE disclosures."
              }
            }
          ]
        }
      ]
    }
