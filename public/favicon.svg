<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#07090e"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(239, 68, 68, 0.4)" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="2 2"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="2 2"/>

  <!-- Plunging Pulse / Cardiogram Wave -->
  <path d="M6 32h14l4-12 6 26 5-20 4 10 7-6 12 24" 
        stroke="url(#pulseGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Impact Dot -->
  <circle cx="56" cy="54" r="3.5" fill="#ff3355"/>
  <circle cx="56" cy="54" r="6" fill="#ff3355" opacity="0.4"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="pulseGradient" x1="6" y1="20" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff8095"/>
      <stop offset="100%" stop-color="#ff2244"/>
    </linearGradient>
  </defs>
</svg>
